name: Update Stock Data

env:
    GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

on:
  schedule:
    # Run every Saturday at 6:00 AM UTC
    - cron: '0 6 * * 6'
  workflow_dispatch: # Allow manual triggering

jobs:
  update-stocks:
    runs-on: ubuntu-latest
    container:
      image: rocker/tidyverse:4.5.1
    permissions:
      contents: write
      actions: read
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install additional R packages
      run: |
        Rscript -e "install.packages(c('tidyquant', 'jsonlite'), repos='https://packagemanager.posit.co/cran/latest')"
        
    - name: Run stock data update
      run: |
        Rscript stocks.R
        
    - name: Commit and push changes
      run: |
        git config --global --add safe.directory /__w/$(echo $GITHUB_REPOSITORY | cut -d'/' -f2)/$(echo $GITHUB_REPOSITORY | cut -d'/' -f2)
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add *.json *.feather
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "data: $(date +'%Y-%m-%d')"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
        fi
